[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps4-avatar-tool"
version = "1.0.0"
description = "PyQt6 PS4 Avatar Tool"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7,<7",
    "Pillow>=10.0,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
